<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💍 Una Aventura Para Ti</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Press Start 2P', monospace;
    overflow: hidden;
  }

  #wrapper {
    position: relative;
    width: 800px;
    max-width: 100vw;
  }

  #hud {
    background: #000;
    color: #fff;
    padding: 8px 16px;
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    border-bottom: 2px solid #fff;
  }

  #gameCanvas {
    display: block;
    background: #5C94FC;
    width: 800px;
    height: 450px;
    max-width: 100vw;
    image-rendering: pixelated;
  }

  /* ── PANTALLAS ── */
  .screen {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 20px;
    z-index: 10;
  }

  #startScreen {
    background: transparent;
    overflow: hidden;
  }
  #startCanvas {
    position: absolute; top:0; left:0; width:100%; height:100%;
    z-index:0; image-rendering: pixelated;
  }
  #startScreen .startContent {
    position: relative; z-index:2;
    display:flex; flex-direction:column; align-items:center;
  }
  #startScreen .title {
    color: #FFD700; font-size: 18px; line-height: 2;
    text-shadow: 3px 3px #8B0000, 0 0 20px #FFD700;
    animation: blink 1.2s step-end infinite;
  }
  #startScreen .subtitle { color: #fff; font-size: 9px; margin-top: 20px; line-height: 2; text-shadow:0 0 8px #aaf; }
  #startScreen .pressStart {
    color: #FFD700; font-size: 10px; margin-top: 30px;
    animation: blink 0.8s step-end infinite;
  }

  #proposalScreen {
    background: radial-gradient(ellipse at center, #1a001a 0%, #000 100%);
    display: none;
  }
  #proposalScreen .ring {
    font-size: 60px; margin-bottom: 20px;
    animation: ringFloat 2s ease-in-out infinite;
  }
  #proposalScreen .question {
    color: #FFD700; font-size: 14px; line-height: 2.2;
    text-shadow: 0 0 20px #FFD700;
    margin-bottom: 30px;
  }
  #proposalScreen .buttons { display: flex; gap: 20px; }
  #proposalScreen .btn {
    font-family: 'Press Start 2P', monospace;
    font-size: 11px; padding: 12px 20px;
    border: 3px solid; cursor: pointer;
    transition: transform .1s;
  }
  #proposalScreen .btn:active { transform: scale(0.95); }
  #proposalScreen .btnYes { background:#FFD700; color:#000; border-color:#fff; }
  #proposalScreen .btnNo  { background:#333;   color:#aaa; border-color:#555; }

  #yesScreen {
    background: radial-gradient(ellipse at center,#0a000a 0%,#000 100%);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 14px 18px;
    overflow: hidden;
  }
  #yesScreen .cover-title {
    color: #FFD700;
    font-size: 11px;
    letter-spacing: 3px;
    text-shadow: 0 0 12px #FFD700, 0 0 28px rgba(255,215,0,0.5);
    animation: blink 1.8s ease-in-out infinite;
  }
  #yesScreen .cover-subtitle {
    color: #fff;
    font-size: 7px;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  #yesScreen .left-col { display:flex; flex-direction:column; align-items:center; gap:6px; }
  #yesScreen .right-col { display:flex; flex-direction:column; align-items:center; gap:6px; }
  #yesScreen .hearts { font-size: 26px; animation: heartsBeat 0.6s ease-in-out infinite alternate; }
  #yesScreen .message { color:#FFD700; font-size: 8px; line-height: 2.2; text-align:center; text-shadow: 0 0 8px #FFD700; }
  #yesScreen .hearts2 { font-size: 18px; margin-top:4px; }
  #pixelCanvas { display:none; border-radius:4px; box-shadow: 0 0 18px #FFD700, 0 0 36px rgba(255,215,0,0.35); }

  /* ── MENSAJE FLOTANTE ── */
  #floatMsg {
    position: absolute;
    top: 60px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.85);
    border: 3px solid #FFD700;
    color: #FFD700;
    font-family: 'Press Start 2P', monospace;
    font-size: 8px; line-height: 1.8;
    padding: 12px 16px;
    text-align: center;
    max-width: 360px;
    z-index: 20;
    display: none;
    pointer-events: none;
  }

  /* ── ANIMACIONES ── */
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes ringFloat { 0%,100%{transform:translateY(0) rotate(-10deg)} 50%{transform:translateY(-15px) rotate(10deg)} }
  @keyframes heartsBeat { from{transform:scale(1)} to{transform:scale(1.15)} }
</style>
</head>
<body>
<div id="wrapper">

  <div id="hud">
    <span id="hudCoins">🪙 ×<span id="coinCount">0</span></span>
    <span><span id="timeOfDayIcon">☀️</span> MUNDO 1-1</span>
    <span style="display:flex;align-items:center;gap:10px;">
      <button id="muteBtn" onclick="toggleMute()" style="font-family:'Press Start 2P',monospace;font-size:9px;background:transparent;border:1px solid #555;color:#aaa;padding:2px 6px;cursor:pointer;">🔊</button>
      <span>⏱ <span id="timeCount">300</span></span>
    </span>
  </div>

  <canvas id="gameCanvas" width="800" height="450"></canvas>

  <!-- Mensaje flotante -->
  <div id="floatMsg" id="floatMsg"></div>

  <!-- Pantalla inicio -->
  <div class="screen" id="startScreen">
    <canvas id="startCanvas"></canvas>
    <div class="startContent">
      <div class="title">✨ UNA AVENTURA<br>PARA TI ✨</div>
      <div class="subtitle">
        Recorre el nivel y descubre<br>
        las pistas de nuestra historia 💛
      </div>
      <div class="pressStart">— PRESIONA ENTER o TAP —</div>
    </div>
  </div>

  <!-- Propuesta -->
  <div class="screen" id="proposalScreen">
    <div class="ring">💍</div>
    <div class="question" id="proposalText"></div>
    <div class="buttons">
      <button class="btn btnYes" onclick="showYes()">¡SÍ! 💛</button>
      <button class="btn btnNo"  onclick="noClick()">...</button>
    </div>
  </div>

  <!-- Respuesta Sí -->
  <div class="screen" id="yesScreen">
    <canvas id="pixelCanvas" width="220" height="220"></canvas>
    <div class="hearts">💛💛💛</div>
    <div class="message" id="yesMessage"></div>
    <div class="hearts2" id="confettiLine"></div>
  </div>

</div>

<script>
// ════════════════════════════════════════════════
//  🎵  MOTOR DE AUDIO CHIPTUNE (Web Audio API)
// ════════════════════════════════════════════════
const Audio8bit = (() => {
  let ctx8, masterGain, bgmNodes = [], bgmRunning = false, bgmIdx = 0, bgmTimeout = null;
  let currentTheme = 'level'; // 'level' | 'proposal' | 'yes'

  function init() {
    if (!ctx8) {
      ctx8 = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = ctx8.createGain();
      masterGain.gain.value = 0.22;
      masterGain.connect(ctx8.destination);
    }
    // CRÍTICO para GitHub Pages: el contexto puede quedar en 'suspended'
    // incluso después de crearse. Hay que llamar resume() en cada interacción.
    if (ctx8.state === 'suspended') {
      ctx8.resume();
    }
  }

  // ── Asegurar contexto activo ──
  function ensureRunning() {
    if (ctx8 && ctx8.state === 'suspended') ctx8.resume();
  }

  // ── Oscilador simple ──
  function playNote(freq, dur, type='square', vol=0.3, delay=0, detune=0) {
    if (!ctx8) return;
    ensureRunning();
    const osc  = ctx8.createOscillator();
    const gain = ctx8.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    osc.detune.value = detune;
    gain.gain.setValueAtTime(0.001, ctx8.currentTime + delay);
    gain.gain.linearRampToValueAtTime(vol, ctx8.currentTime + delay + 0.01);
    gain.gain.linearRampToValueAtTime(0.001, ctx8.currentTime + delay + dur - 0.01);
    osc.connect(gain);
    gain.connect(masterGain);
    osc.start(ctx8.currentTime + delay);
    osc.stop(ctx8.currentTime + delay + dur);
    return osc;
  }

  // ── Ruido blanco (percusión) ──
  function playNoise(dur, vol=0.15, delay=0) {
    if (!ctx8) return;
    ensureRunning();
    const bufSize = ctx8.sampleRate * dur;
    const buf = ctx8.createBuffer(1, bufSize, ctx8.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
    const src  = ctx8.createBufferSource();
    const gain = ctx8.createGain();
    src.buffer = buf;
    gain.gain.setValueAtTime(vol, ctx8.currentTime + delay);
    gain.gain.linearRampToValueAtTime(0.001, ctx8.currentTime + delay + dur);
    src.connect(gain);
    gain.connect(masterGain);
    src.start(ctx8.currentTime + delay);
  }

  // ══════════════════════════════════════
  //  MELODÍAS
  // ══════════════════════════════════════

  // Notas musicales → frecuencias
  const N = {
    C4:261.6,D4:293.7,E4:329.6,F4:349.2,G4:392,A4:440,B4:493.9,
    C5:523.3,D5:587.3,E5:659.3,F5:698.5,G5:784,A5:880,B5:987.8,
    C6:1046.5,D6:1174.7,E6:1318.5,
    Bb4:466.2,Fs4:370,Gs4:415.3,As4:466.2,
    Bb5:932.3,Fs5:740,Gs5:830.6,
    r:0 // silencio
  };

  // ── BGM Nivel (estilo Mario overworld, loop) ──
  // Secuencia: [frecuencia, duración_seg]
  const BGM_LEVEL = [
    // Frase A
    [N.E5,.12],[N.E5,.12],[N.r,.12],[N.E5,.12],[N.r,.12],[N.C5,.12],[N.E5,.25],[N.G5,.25],[N.r,.25],[N.G4,.25],[N.r,.5],
    // Frase B
    [N.C5,.20],[N.r,.12],[N.G4,.20],[N.r,.25],[N.E4,.20],[N.r,.12],[N.A4,.18],[N.r,.06],[N.B4,.18],[N.Bb4,.12],[N.A4,.20],
    [N.G4,.16],[N.E5,.16],[N.G5,.16],[N.A5,.20],[N.F5,.15],[N.G5,.12],[N.r,.08],[N.E5,.20],[N.r,.06],[N.C5,.15],[N.D5,.12],[N.B4,.20],[N.r,.15],
    // Frase C (puente)
    [N.G5,.12],[N.Fs5,.12],[N.F5,.12],[N.D5,.15],[N.E5,.15],[N.r,.08],[N.Gs4,.12],[N.A4,.12],[N.C5,.12],[N.r,.08],[N.A4,.12],[N.C5,.12],[N.D5,.20],
    [N.G5,.12],[N.Fs5,.12],[N.F5,.12],[N.D5,.15],[N.E5,.15],[N.r,.08],[N.C6,.20],[N.r,.06],[N.C6,.20],[N.C6,.25],[N.r,.3],
    // Frase D
    [N.G5,.12],[N.Fs5,.12],[N.F5,.12],[N.D5,.15],[N.E5,.15],[N.r,.08],[N.Gs4,.12],[N.A4,.12],[N.C5,.12],[N.r,.08],[N.A4,.12],[N.C5,.12],[N.D5,.20],
    [N.Gs4,.15],[N.r,.06],[N.A4,.15],[N.r,.06],[N.F5,.15],[N.r,.06],[N.A4,.20],[N.C5,.15],[N.r,.06],[N.A4,.15],[N.C5,.12],[N.D5,.12],
  ];

  // ── Melodía romántica (propuesta / sí) ──
  const BGM_ROMANCE = [
    [N.C5,.3],[N.E5,.3],[N.G5,.3],[N.E5,.3],
    [N.D5,.3],[N.F5,.3],[N.A5,.3],[N.F5,.3],
    [N.E5,.3],[N.G5,.3],[N.B5,.3],[N.G5,.3],
    [N.C5,.6],[N.r,.2],
    [N.G4,.3],[N.C5,.3],[N.E5,.3],[N.C5,.3],
    [N.A4,.3],[N.C5,.3],[N.E5,.3],[N.C5,.3],
    [N.F4,.3],[N.A4,.3],[N.C5,.3],[N.A4,.3],
    [N.G4,.6],[N.r,.3],
    [N.E5,.25],[N.D5,.25],[N.C5,.25],[N.D5,.25],[N.E5,.4],[N.r,.1],
    [N.E5,.25],[N.D5,.25],[N.C5,.4],[N.r,.2],
    [N.A4,.25],[N.B4,.25],[N.C5,.25],[N.B4,.25],[N.A4,.4],[N.r,.1],
    [N.G4,.5],[N.r,.3],
  ];

  // ── Fanfarria castillo ──
  const FANFARE = [
    [N.C5,.12],[N.C5,.12],[N.C5,.12],[N.C5,.18],[N.Gs4,.18],[N.As4,.12],
    [N.C5,.12],[N.As4,.12],[N.C5,.3],
  ];

  // ── Victoria (sí) ──
  const VICTORY = [
    [N.C5,.1],[N.C5,.1],[N.C5,.1],[N.F5,.4],[N.r,.05],
    [N.F5,.1],[N.G5,.1],[N.Gs5,.1],[N.G5,.1],[N.r,.05],
    [N.C5,.1],[N.C5,.1],[N.C5,.1],[N.F5,.4],[N.r,.05],
    [N.As5,.4],[N.r,.05],[N.As5,.1],[N.A5,.1],[N.Gs5,.1],[N.G5,.4],[N.r,.1],
    [N.E5,.1],[N.E5,.1],[N.E5,.1],[N.C5,.4],[N.r,.05],
    [N.E5,.1],[N.G5,.1],[N.Gs5,.1],[N.G5,.1],[N.r,.05],
    [N.C5,.1],[N.C5,.1],[N.C5,.1],[N.F5,.4],[N.r,.05],
    [N.G5,.5],[N.r,.1],
  ];

  let bgmSeq = [], bgmLoops = true;

  function stopBGM() {
    bgmRunning = false;
    clearTimeout(bgmTimeout);
    bgmNodes.forEach(n => { try { n.stop(); } catch(e){} });
    bgmNodes = [];
  }

  function playSequence(seq, loop=true, onDone=null) {
    stopBGM();
    bgmSeq   = seq;
    bgmLoops = loop;
    bgmRunning = true;
    bgmIdx = 0;
    scheduleNext(onDone);
  }

  function scheduleNext(onDone) {
    if (!bgmRunning) return;
    if (bgmIdx >= bgmSeq.length) {
      if (bgmLoops) { bgmIdx = 0; }
      else { if (onDone) onDone(); return; }
    }
    const [freq, dur] = bgmSeq[bgmIdx++];
    if (freq > 0) {
      const o = playNote(freq, dur * 0.85, 'square', 0.28);
      if (o) bgmNodes.push(o);
      // bajo (armónico)
      const o2 = playNote(freq / 2, dur * 0.85, 'triangle', 0.12);
      if (o2) bgmNodes.push(o2);
    }
    bgmTimeout = setTimeout(() => scheduleNext(onDone), dur * 1000);
  }

  // ══════════════════════════════════════
  //  SFX
  // ══════════════════════════════════════

  function sfxCoin() {
    playNote(N.B5, 0.06, 'square', 0.3);
    playNote(N.E6, 0.12, 'square', 0.25, 0.07);
  }

  function sfxJump() {
    const osc = ctx8.createOscillator();
    const gain = ctx8.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(300, ctx8.currentTime);
    osc.frequency.exponentialRampToValueAtTime(600, ctx8.currentTime + 0.1);
    gain.gain.setValueAtTime(0.25, ctx8.currentTime);
    gain.gain.linearRampToValueAtTime(0.001, ctx8.currentTime + 0.15);
    osc.connect(gain); gain.connect(masterGain);
    osc.start(); osc.stop(ctx8.currentTime + 0.15);
  }

  function sfxStomp() {
    playNote(200, 0.05, 'square', 0.4);
    playNoise(0.08, 0.2, 0.03);
  }

  function sfxDeath() {
    stopBGM();
    const notes = [[494,.1],[392,.1],[311,.1],[220,.1],[196,.1],[147,.15],[110,.2]];
    notes.forEach(([f,d],i) => {
      const t = notes.slice(0,i).reduce((a,n)=>a+n[1],0);
      playNote(f, d*0.9, 'square', 0.3, t);
    });
    setTimeout(() => {
      if (gameState === 'playing') playSequence(BGM_LEVEL, true);
    }, 1800);
  }

  function sfxStar() {
    const notes = [N.G5,N.A5,N.B5,N.C6];
    notes.forEach((f,i) => playNote(f, 0.1, 'sine', 0.35, i*0.08));
  }

  function sfxFanfare(onDone) {
    stopBGM();
    FANFARE.forEach(([f,d],i) => {
      const t = FANFARE.slice(0,i).reduce((a,n)=>a+n[1],0);
      playNote(f, d*0.9, 'square', 0.35, t);
      playNote(f/2, d*0.9, 'triangle', 0.15, t);
    });
    const total = FANFARE.reduce((a,n)=>a+n[1],0);
    setTimeout(() => {
      playSequence(BGM_ROMANCE, true);
      if (onDone) onDone();
    }, total * 1000 + 200);
  }

  function sfxVictory() {
    stopBGM();
    let t = 0;
    VICTORY.forEach(([f,d]) => {
      if (f > 0) {
        playNote(f, d*0.88, 'square', 0.32, t);
        playNote(f/2, d*0.88, 'triangle', 0.14, t);
      }
      t += d;
    });
    setTimeout(() => playSequence(BGM_ROMANCE, true), t * 1000 + 300);
  }

  // ══════════════════════════════════════
  //  API PÚBLICA
  // ══════════════════════════════════════
  return {
    init,
    startLevel()  { playSequence(BGM_LEVEL, true); },
    stopAll()     { stopBGM(); },
    coin()        { sfxCoin(); },
    jump()        { sfxJump(); },
    stomp()       { sfxStomp(); },
    death()       { sfxDeath(); },
    star()        { sfxStar(); },
    fanfare(cb)   { sfxFanfare(cb); },
    victory()     { sfxVictory(); },
    _setMute(on)  { if(masterGain) masterGain.gain.value = on ? 0 : 0.22; },
    _getCtx()     { return ctx8; },
    _getMaster()  { return masterGain; },
  };
})();

// ════════════════════════════════════════════════
//  🌌  PANTALLA DE INICIO — GALAXIA + MUNDOS
// ════════════════════════════════════════════════
const StartScreen = (() => {
  let sc, sctx, W2, H2, raf, started = false;

  // ── Estrellas ──
  const STARS = [];
  function initStars(w,h){
    STARS.length = 0;
    for(let i=0;i<180;i++){
      STARS.push({
        x: Math.random()*w, y: Math.random()*h,
        r: Math.random()*1.4+0.3,
        speed: Math.random()*0.15+0.03,
        bright: Math.random()
      });
    }
  }

  // ── Nebulosa pixel-art ──
  function drawNebula(ctx,w,h){
    // nube grande morada
    const blobs = [
      {cx:w*0.18,cy:h*0.28,rx:110,ry:70, c:'rgba(80,0,160,0.18)'},
      {cx:w*0.75,cy:h*0.22,rx:90, ry:60, c:'rgba(0,60,160,0.20)'},
      {cx:w*0.55,cy:h*0.65,rx:120,ry:55, c:'rgba(120,0,100,0.15)'},
      {cx:w*0.30,cy:h*0.72,rx:80, ry:50, c:'rgba(0,80,120,0.17)'},
    ];
    blobs.forEach(b=>{
      const g = ctx.createRadialGradient(b.cx,b.cy,0, b.cx,b.cy,Math.max(b.rx,b.ry));
      g.addColorStop(0,b.c);
      g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.save();
      ctx.scale(b.rx/Math.max(b.rx,b.ry), b.ry/Math.max(b.rx,b.ry));
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(b.cx/(b.rx/Math.max(b.rx,b.ry)), b.cy/(b.ry/Math.max(b.rx,b.ry)),
              Math.max(b.rx,b.ry), 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    });
  }

  // ── Planetas pixel-art ──
  const PLANETS = [
    // {x,y,r, color base, ring, spots, phase}
    {x:0.12, y:0.35, r:28, col:'#4488CC', ring:false, spots:['#6aacee','#2255aa'], phase:0, speed:0.0008},
    {x:0.82, y:0.55, r:22, col:'#CC6633', ring:true,  spots:['#ee8855','#aa4422'], phase:1.2, speed:0.0006},
    {x:0.50, y:0.14, r:18, col:'#44BB88', ring:false, spots:['#66ddaa','#228855'], phase:2.4, speed:0.001},
    {x:0.70, y:0.78, r:14, col:'#9944CC', ring:false, spots:['#bb66ee','#7722aa'], phase:0.8, speed:0.0012},
    {x:0.25, y:0.82, r:12, col:'#CCAA22', ring:true,  spots:['#eecc44','#aa8800'], phase:3.1, speed:0.0009},
  ];
  let planetPhases = PLANETS.map(p=>p.phase);

  function drawPlanet(ctx, px,py, r, col, spots, ring, t){
    // sombra suave
    const shadow = ctx.createRadialGradient(px-r*0.25,py-r*0.25,r*0.1, px,py,r*1.1);
    shadow.addColorStop(0,'rgba(0,0,0,0)');
    shadow.addColorStop(1,'rgba(0,0,0,0.5)');

    // cuerpo del planeta
    const grad = ctx.createRadialGradient(px-r*0.3,py-r*0.3,r*0.1, px,py,r);
    grad.addColorStop(0, lighten(col,0.5));
    grad.addColorStop(0.55, col);
    grad.addColorStop(1, darken(col,0.5));
    ctx.beginPath();
    ctx.arc(px,py,r,0,Math.PI*2);
    ctx.fillStyle = grad;
    ctx.fill();

    // bandas pixel-art (líneas horizontales)
    ctx.save();
    ctx.beginPath(); ctx.arc(px,py,r,0,Math.PI*2); ctx.clip();
    for(let i=-r;i<r;i+=Math.max(3,r/5)){
      ctx.fillStyle = i%2===0 ? 'rgba(255,255,255,0.07)' : 'rgba(0,0,0,0.09)';
      ctx.fillRect(px-r, py+i, r*2, Math.max(2,r/6));
    }
    // manchas/continentes pixelados
    spots.forEach((sc2,si)=>{
      const ang  = t + si*2.1;
      const sx   = px + Math.cos(ang)*r*0.35;
      const sy   = py + Math.sin(ang*0.7)*r*0.25;
      const sr   = r*(0.18+si*0.08);
      ctx.fillStyle = sc2+'aa';
      ctx.fillRect(sx-sr,sy-sr/2,sr*1.8,sr);
    });
    ctx.restore();

    // sombra lateral (oscurece lado derecho)
    ctx.beginPath(); ctx.arc(px,py,r,0,Math.PI*2);
    ctx.fillStyle = shadow; ctx.fill();

    // anillo (si tiene)
    if(ring){
      ctx.save();
      ctx.translate(px,py);
      ctx.scale(1,0.30);
      ctx.beginPath();
      ctx.arc(0,0,r*1.65,0,Math.PI*2);
      ctx.strokeStyle = lighten(col,0.3)+'88';
      ctx.lineWidth = Math.max(3,r*0.28);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(0,0,r*1.85,0,Math.PI*2);
      ctx.strokeStyle = col+'44';
      ctx.lineWidth = Math.max(2,r*0.15);
      ctx.stroke();
      ctx.restore();
    }

    // brillo especular
    ctx.beginPath();
    ctx.arc(px-r*0.3, py-r*0.3, r*0.22, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,255,255,0.22)';
    ctx.fill();
  }

  function lighten(hex, f){
    const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
    return '#'+[r,g,b].map(c=>Math.min(255,Math.round(c+(255-c)*f)).toString(16).padStart(2,'0')).join('');
  }
  function darken(hex, f){
    const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
    return '#'+[r,g,b].map(c=>Math.max(0,Math.round(c*(1-f))).toString(16).padStart(2,'0')).join('');
  }

  // ── Partículas de polvo estelar ──
  const DUST = [];
  function initDust(w,h){
    DUST.length=0;
    for(let i=0;i<55;i++){
      DUST.push({
        x:Math.random()*w, y:Math.random()*h,
        vx:(Math.random()-0.5)*0.2, vy:(Math.random()-0.5)*0.2,
        r:Math.random()*2, life:Math.random(),
        col:['#aaddff','#ffaaee','#ffffaa','#aaffcc'][Math.floor(Math.random()*4)]
      });
    }
  }

  let t = 0;
  function galaxyLoop(){
    if(!started) return;
    raf = requestAnimationFrame(galaxyLoop);
    t += 0.016;
    sctx.clearRect(0,0,W2,H2);

    // fondo degradado azul oscuro
    const bg = sctx.createLinearGradient(0,0,0,H2);
    bg.addColorStop(0,'#000012');
    bg.addColorStop(0.5,'#000830');
    bg.addColorStop(1,'#000018');
    sctx.fillStyle=bg; sctx.fillRect(0,0,W2,H2);

    // nebulosa
    drawNebula(sctx,W2,H2);

    // estrellas con twinkle
    STARS.forEach(s=>{
      s.bright += s.speed;
      const b = 0.5+0.5*Math.sin(s.bright*3);
      sctx.beginPath();
      sctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      sctx.fillStyle = `rgba(255,255,255,${0.4+b*0.6})`;
      sctx.fill();
      // estrellas de 4 puntas para las más grandes
      if(s.r>1.1){
        sctx.strokeStyle=`rgba(255,255,255,${b*0.5})`;
        sctx.lineWidth=0.8;
        sctx.beginPath();
        sctx.moveTo(s.x-s.r*2.5,s.y); sctx.lineTo(s.x+s.r*2.5,s.y);
        sctx.moveTo(s.x,s.y-s.r*2.5); sctx.lineTo(s.x,s.y+s.r*2.5);
        sctx.stroke();
      }
    });

    // polvo estelar
    DUST.forEach(d=>{
      d.x+=d.vx; d.y+=d.vy;
      if(d.x<0)d.x=W2; if(d.x>W2)d.x=0;
      if(d.y<0)d.y=H2; if(d.y>H2)d.y=0;
      sctx.beginPath();
      sctx.arc(d.x,d.y,d.r,0,Math.PI*2);
      sctx.fillStyle=d.col+'66';
      sctx.fill();
    });

    // planetas flotando suavemente
    PLANETS.forEach((p,i)=>{
      planetPhases[i] += p.speed;
      const plx = p.x*W2 + Math.sin(planetPhases[i])*10;
      const ply = p.y*H2 + Math.cos(planetPhases[i]*0.7)*7;
      drawPlanet(sctx, plx,ply, p.r, p.col, p.spots, p.ring, planetPhases[i]*2);
    });
  }

  return {
    init(){
      sc   = document.getElementById('startCanvas');
      W2   = sc.width  = 800;
      H2   = sc.height = 500; // ligeramente mayor que el canvas de juego (incluye HUD)
      sctx = sc.getContext('2d');
      initStars(W2,H2);
      initDust(W2,H2);
      started = true;
      galaxyLoop();
    },
    stop(){
      started = false;
      if(raf) cancelAnimationFrame(raf);
    }
  };
})();

const IntroMusic = (() => {
  let nodes=[], running=false, to=null;

  // Melodía de intro estilo Super Mario / Castlevania
  const INTRO = [
    // intro rápida ascendente
    [392,.08],[440,.08],[494,.08],[523,.12],[0,.06],
    [523,.08],[587,.08],[659,.08],[698,.12],[0,.06],
    // tema principal
    [784,.18],[698,.10],[784,.18],[0,.06],
    [880,.18],[784,.10],[880,.18],[0,.06],
    [988,.30],[0,.08],
    // bajada dramática
    [880,.12],[784,.12],[698,.12],[659,.20],[0,.08],
    [784,.12],[698,.12],[659,.12],[587,.20],[0,.08],
    // puente
    [523,.15],[587,.15],[659,.15],[698,.30],[0,.1],
    [659,.15],[587,.15],[523,.15],[494,.30],[0,.1],
    // fanfarria final antes de jugar
    [523,.10],[0,.04],[523,.10],[0,.04],[523,.10],[0,.04],
    [784,.40],[0,.08],[698,.30],[0,.06],[784,.45],
  ];

  function playIntroNote(freq,dur,delay,ctx8b,mg){
    if(!freq) return;
    const o=ctx8b.createOscillator(), g=ctx8b.createGain();
    o.type='square'; o.frequency.value=freq;
    o.detune.value=-8;
    g.gain.setValueAtTime(0.001, ctx8b.currentTime+delay);
    g.gain.linearRampToValueAtTime(0.32, ctx8b.currentTime+delay+0.01);
    g.gain.linearRampToValueAtTime(0.001, ctx8b.currentTime+delay+dur-0.01);
    o.connect(g); g.connect(mg);
    o.start(ctx8b.currentTime+delay);
    o.stop(ctx8b.currentTime+delay+dur);
    nodes.push(o);
    // bajo armónico
    const o2=ctx8b.createOscillator(), g2=ctx8b.createGain();
    o2.type='triangle'; o2.frequency.value=freq/2;
    g2.gain.setValueAtTime(0.001, ctx8b.currentTime+delay);
    g2.gain.linearRampToValueAtTime(0.12, ctx8b.currentTime+delay+0.01);
    g2.gain.linearRampToValueAtTime(0.001, ctx8b.currentTime+delay+dur-0.01);
    o2.connect(g2); g2.connect(mg);
    o2.start(ctx8b.currentTime+delay); o2.stop(ctx8b.currentTime+delay+dur);
    nodes.push(o2);
  }

  return {
    play(ctx8b, mg){
      if(running) return;
      running=true;
      let t=0;
      INTRO.forEach(([f,d])=>{
        playIntroNote(f,d,t,ctx8b,mg);
        t+=d;
      });
      to = setTimeout(()=>{ running=false; }, t*1000+500);
    },
    stop(){
      running=false;
      if(to) clearTimeout(to);
      nodes.forEach(n=>{ try{n.stop();}catch(e){} });
      nodes=[];
    }
  };
})();

// Dibuja sprite desde mapa de colores (array de strings, 1 char = 1 píxel de 3px)
// palette = { char: color }
function spr(map, palette, dx, dy, scale=3, flipX=false){
  const rows = map.length, cols = map[0].length;
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      const ch = map[r][flipX ? cols-1-c : c];
      if(ch===' '||ch==='.') continue;
      const col = palette[ch];
      if(!col) continue;
      ctx.fillStyle = col;
      ctx.fillRect(dx + c*scale, dy + r*scale, scale, scale);
    }
  }
}

    for(let bx=sx;bx<sx+w;bx+=16){

      ctx.fillRect(bx,by,16,16);
      // contorno bloque
      ctx.fillStyle=PAL.CASTLE.s;
      ctx.fillRect(bx,by,16,1);
      ctx.fillRect(bx,by,1,16);
      ctx.fillStyle=PAL.CASTLE.D;
      ctx.fillRect(bx+15,by,1,16);
      ctx.fillRect(bx,by+15,16,1);
    }
  }
  // capa superior (merlones)
  for(let bx=sx;bx<sx+w;bx+=24){
    ctx.fillStyle=PAL.CASTLE.W;
    ctx.fillRect(bx,sy+10,18,22);
    ctx.fillStyle=PAL.CASTLE.L;
    ctx.fillRect(bx,sy+10,18,2);
    ctx.fillRect(bx,sy+10,2,22);
    ctx.fillStyle=PAL.CASTLE.s;
    ctx.fillRect(bx+16,sy+10,2,22);
  }
  ctx.fillStyle=PAL.CASTLE.W;
  ctx.fillRect(sx,sy+30,w,4);

  // puerta arco
  const px2=sx+w/2, pdoor=sy+h-58;
  ctx.fillStyle=PAL.CASTLE.K;
  ctx.fillRect(px2-16,pdoor,32,58);
  ctx.beginPath();
  ctx.arc(px2,pdoor+16,16,Math.PI,0);

  // madera puerta

  ctx.fillRect(px2-14,pdoor+16,13,40);
  ctx.fillRect(px2+1, pdoor+16,13,40);
  ctx.fillStyle=PAL.CASTLE.Y;
  ctx.fillRect(px2-3,pdoor+30,6,6);

  // ventanas con arco
  [[sx+14,sy+55],[sx+w-36,sy+55]].forEach(([wx,wy])=>{
    ctx.fillStyle=PAL.CASTLE.K;
    ctx.fillRect(wx,wy,22,22);
    ctx.beginPath(); ctx.arc(wx+11,wy+11,11,Math.PI,0); ctx.fill();
    ctx.fillStyle='#3366BB';
    ctx.fillRect(wx+2,wy+11,18,11);
    ctx.beginPath(); ctx.arc(wx+11,wy+11,9,Math.PI,0); ctx.fill();
    // cruz ventana
    ctx.fillStyle=PAL.CASTLE.s;
    ctx.fillRect(wx+10,wy+6,2,16);
    ctx.fillRect(wx+3,wy+13,16,2);
  });

  // bandera con mástil
  ctx.fillStyle=PAL.CASTLE.D;
  ctx.fillRect(px2-2,sy-10,3,24);
  // bandera degradada
  const fg=ctx.createLinearGradient(px2,sy-10,px2+22,sy-10);
  fg.addColorStop(0,PAL.CASTLE.R);
  fg.addColorStop(1,'#FF6666');
  ctx.fillStyle=fg;
  ctx.fillRect(px2+1,sy-10,20,13);
  ctx.fillStyle='#fff';
  ctx.font='bold 10px serif';
  ctx.fillText('💍',px2+3,sy+1);

  // highlight lateral izquierdo (luz)
  ctx.fillStyle='rgba(255,255,255,0.07)';
  ctx.fillRect(sx,sy+30,6,h-30);
}

// Nube SNES — degradada y con contorno
function drawCloud(sx,sy){
  const blobs=[{x:20,y:18,r:16},{x:38,y:11,r:21},{x:58,y:18,r:15}];
  // sombra inferior
  ctx.fillStyle='rgba(140,180,255,0.35)';
  blobs.forEach(b=>{
    ctx.beginPath(); ctx.arc(sx+b.x+2,sy+b.y+4,b.r,0,Math.PI*2); ctx.fill();
  });
  // cuerpo blanco
  ctx.fillStyle='#F4F9FF';
  blobs.forEach(b=>{
    ctx.beginPath(); ctx.arc(sx+b.x,sy+b.y,b.r,0,Math.PI*2); ctx.fill();
  });
  // highlight superior
  ctx.fillStyle='#FFFFFF';
  blobs.forEach(b=>{
    ctx.beginPath(); ctx.arc(sx+b.x-2,sy+b.y-3,b.r*0.55,0,Math.PI*2); ctx.fill();
  });
  // contorno azul suave
  ctx.strokeStyle='#90B8E8';
  ctx.lineWidth=1.5;
  ctx.beginPath();
  blobs.forEach(b=>{ ctx.arc(sx+b.x,sy+b.y,b.r,0,Math.PI*2); });
  ctx.stroke();
}

// Arbusto SNES — con luces y sombras
function drawBush(sx,sy,tod){
  const night = tod && tod.name==='night';
  const dusk  = tod && tod.name==='dusk';
  const c1 = night?'#0A2006': dusk?'#284010':'#30A020';
  const c2 = night?'#0E2808': dusk?'#304808':'#28B018';
  const cH = night?'#162E0A': dusk?'#486018':'#60E040';
  const cD = night?'#060F03': dusk?'#1A2C08':'#1A6010';

  ctx.fillStyle='rgba(0,30,0,0.20)';
  ctx.beginPath();
  ctx.ellipse(sx+26,sy+20,26,8,0,0,Math.PI*2); ctx.fill();

  const blobs=[{x:12,y:12,r:12,c:c1},{x:26,y:7,r:15,c:c2},{x:40,y:12,r:11,c:c1}];
  blobs.forEach(b=>{
    ctx.fillStyle=b.c;
    ctx.beginPath(); ctx.arc(sx+b.x,sy+b.y,b.r,0,Math.PI*2); ctx.fill();
  });
  blobs.forEach(b=>{
    ctx.fillStyle=cH;
    ctx.beginPath(); ctx.arc(sx+b.x-2,sy+b.y-3,b.r*0.4,0,Math.PI*2); ctx.fill();
  });
  ctx.fillStyle=cD;
  [[sx+8,sy+14],[sx+35,sy+14],[sx+22,sy+5],[sx+16,sy+9],[sx+32,sy+8]].forEach(([dx,dy])=>{
    ctx.fillRect(dx,dy,2,2);
  });
}

// Tile suelo SNES — hierba + tierra con textura
function drawBlock(sx,sy,w,h,tod){
  const night  = tod && tod.name==='night';
  const dusk   = tod && tod.name==='dusk';
  const dawn   = tod && tod.name==='dawn';
  const gC  = night?'#0D2208': dusk?'#3A5010': dawn?'#28700A': PAL.GROUND.G;
  const gC2 = night?'#081504': dusk?'#283008': dawn?'#1A5006': PAL.GROUND.g;
  const tC  = night?'#3A1A08': dusk?'#7A3C10': PAL.GROUND.T;
  const tC2 = night?'#280E04': dusk?'#5A2808': PAL.GROUND.t;
  const tC3 = night?'#1A0802': dusk?'#3A1804': PAL.GROUND.D;
  const lC  = night?'#602808': dusk?'#C07030': PAL.GROUND.L;

  // tierra base
  const tg = ctx.createLinearGradient(sx,sy,sx,sy+h);
  tg.addColorStop(0,tC);
  tg.addColorStop(0.5,tC2);
  tg.addColorStop(1,tC3);
  ctx.fillStyle=tg; ctx.fillRect(sx,sy,w,h);

  // textura de tierra
  ctx.fillStyle=tC3;
  for(let bx2=sx+8;bx2<sx+w-4;bx2+=22){
    for(let by2=sy+14;by2<sy+h-6;by2+=18){
      ctx.fillRect(bx2,by2,14,1);
      ctx.fillRect(bx2+6,by2+9,12,1);
    }
  }
  ctx.fillStyle=lC; ctx.fillRect(sx,sy,w,3);

  // hierba
  ctx.fillStyle=gC; ctx.fillRect(sx,sy,w,8);
  ctx.fillStyle=gC2;
  for(let gx=sx+2;gx<sx+w-2;gx+=6) ctx.fillRect(gx,sy,3,4);
  ctx.fillRect(sx,sy+8,w,2);
}

// Plataforma elevada SNES — ladrillo estilo DKC
function drawElevatedPlat(sx,sy,w,tod){
  const BH=18;
  const night = tod && tod.name==='night';
  const dusk  = tod && tod.name==='dusk';
  const bL = night?'#4A2808': dusk?'#C07030': PAL.BRICK.L;
  const bB = night?'#2E1604': dusk?'#904820': PAL.BRICK.B;
  const bM = night?'#1E0E02': dusk?'#683010': PAL.BRICK.M;

  const bg2=ctx.createLinearGradient(sx,sy,sx,sy+BH);
  bg2.addColorStop(0,bL);
  bg2.addColorStop(0.5,bB);
  bg2.addColorStop(1,bM);
  ctx.fillStyle=bg2; ctx.fillRect(sx,sy,w,BH);

  ctx.fillStyle=PAL.BRICK.K;
  ctx.fillRect(sx,sy+8,w,2);
  for(let bx=sx;bx<sx+w;bx+=24){ ctx.fillRect(bx,sy,2,8); }
  for(let bx=sx+12;bx<sx+w;bx+=24){ ctx.fillRect(bx,sy+10,2,8); }
  ctx.fillStyle=bL; ctx.fillRect(sx,sy,w,3);
  ctx.fillStyle=bM; ctx.fillRect(sx,sy+15,w,3);
}

function startGame(){
  Audio8bit.init(); // crea contexto + resume
  // Detener galaxia y música de intro
  StartScreen.stop();
  IntroMusic.stop();
  document.getElementById('startScreen').style.display='none';
  gameState='playing';
  // Pequeño delay para que el resume() del contexto tenga efecto antes de tocar
  setTimeout(() => Audio8bit.startLevel(), 80);
  timerInterval = setInterval(()=>{
    if(gameState==='playing'){
      timer = Math.max(0,timer-1);
      document.getElementById('timeCount').textContent=timer;
    }
  },1000);
  requestAnimationFrame(loop);
}

function resetPlayer(){
  px=60; py=280; pvx=0; pvy=0; onGround=false;
  pDead=false; pDeadTimer=0; camX=0;
}

function showFloat(msg){
  const el = document.getElementById('floatMsg');
  el.innerHTML = msg.replace(/\n/g,'<br>');
  el.style.display='block';
  clearTimeout(window._floatTO);
  window._floatTO = setTimeout(()=>{ el.style.display='none'; },3500);
}

function triggerProposal(){
  clearInterval(timerInterval);
  gameState='proposal';
  Audio8bit.fanfare(() => {});
  document.getElementById('proposalText').innerHTML =
    CONFIG.propuesta.replace(/\n/g,'<br>');
  setTimeout(() => {
    document.getElementById('proposalScreen').style.display='flex';
  }, 1800);
}

function showYes(){
  document.getElementById('proposalScreen').style.display='none';
  document.getElementById('yesScreen').style.display='flex';
  document.getElementById('yesMessage').innerHTML =
    CONFIG.mensajeSi.replace(/\n/g,'<br>');
  document.getElementById('confettiLine').textContent='💛🎉💍🎊💛';
  gameState='yes';
  Audio8bit.victory();
  renderPixelArt();
}

// ── Portada videojuego retro 90s ──
function renderPixelArt(){
  const OUT = 220;
  const pc  = document.getElementById('pixelCanvas');
  pc.width  = OUT;
  pc.height = OUT;
  const pctx = pc.getContext('2d');

  const tmp  = document.createElement('canvas');
  tmp.width  = OUT;
  tmp.height = OUT;
  const tctx = tmp.getContext('2d');

  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.src = 'data:image/jpeg;base64,' + PHOTO_B64;
  img.onload = () => {
    const s  = Math.min(img.width, img.height);
    const ox = (img.width  - s) / 2;
    const oy = (img.height - s) / 2;
    tctx.drawImage(img, ox, oy, s, s, 0, 0, OUT, OUT);

    // Saturacion + contraste estilo caratula 90s
    const imgData = tctx.getImageData(0, 0, OUT, OUT);
    const d = imgData.data;
    for(let i = 0; i < d.length; i += 4){
      let r = d[i], g = d[i+1], b = d[i+2];
      const avg = (r + g + b) / 3;
      const sat = 1.7;
      r = avg + (r - avg) * sat;
      g = avg + (g - avg) * sat;
      b = avg + (b - avg) * sat;
      const con = 1.35, mid = 128;
      r = (r - mid) * con + mid;
      g = (g - mid) * con + mid;
      b = (b - mid) * con + mid;
      d[i]   = Math.max(0, Math.min(255, r));
      d[i+1] = Math.max(0, Math.min(255, g));
      d[i+2] = Math.max(0, Math.min(255, b));
    }
    tctx.putImageData(imgData, 0, 0);
    pctx.drawImage(tmp, 0, 0);

    // Scan lines CRT
    for(let y = 0; y < OUT; y += 3){
      pctx.fillStyle = 'rgba(0,0,0,0.22)';
      pctx.fillRect(0, y, OUT, 1);
    }

    // Vigneta oscura
    const vignette = pctx.createRadialGradient(OUT/2,OUT/2,OUT*0.3, OUT/2,OUT/2,OUT*0.75);
    vignette.addColorStop(0, 'rgba(0,0,0,0)');
    vignette.addColorStop(1, 'rgba(0,0,0,0.55)');
    pctx.fillStyle = vignette;
    pctx.fillRect(0, 0, OUT, OUT);

    // Marco doble
    pctx.strokeStyle = '#fff';
    pctx.lineWidth   = 2;
    pctx.strokeRect(6, 6, OUT-12, OUT-12);
    pctx.strokeStyle = '#FFD700';
    pctx.lineWidth   = 4;
    pctx.strokeRect(2, 2, OUT-4, OUT-4);

    // Brillo neon en esquinas
    [[2,2],[OUT-2,2],[2,OUT-2],[OUT-2,OUT-2]].forEach(([cx,cy]) => {
      const g2 = pctx.createRadialGradient(cx,cy,0, cx,cy,22);
      g2.addColorStop(0, 'rgba(255,215,0,0.55)');
      g2.addColorStop(1, 'rgba(255,215,0,0)');
      pctx.fillStyle = g2;
      pctx.fillRect(cx-22, cy-22, 44, 44);
    });

    pc.style.display = 'block';
  };
  img.onerror = () => { pc.style.display = 'none'; };
}

function noClick(){
  // El botón "No" se escapa... clásico
  const btn = document.querySelector('.btnNo');
  const pw = document.getElementById('proposalScreen');
  const maxX = pw.offsetWidth - btn.offsetWidth - 20;
  const maxY = pw.offsetHeight - btn.offsetHeight - 20;
  btn.style.position='absolute';
  btn.style.left = Math.random()*maxX+'px';
  btn.style.top  = Math.random()*maxY+'px';
}

// ── Colisión AABB ──
function collideRect(ax,ay,aw,ah, bx,by,bw,bh){
  return ax<bx+bw && ax+aw>bx && ay<by+bh && ay+ah>by;
}

function update(){
  if(gameState!=='playing') return;

  // Input
  if(!pDead){
    pvx = 0;
    if(keys['ArrowLeft']  || keys['a'] || keys['A']) { pvx=-SPEED; pDir=-1; }
    if(keys['ArrowRight'] || keys['d'] || keys['D']) { pvx= SPEED; pDir= 1; }
    if((keys['ArrowUp']||keys['w']||keys['W']||keys[' ']) && onGround){
      pvy=JUMP; onGround=false; Audio8bit.jump();
    }
  } else {
    // animación muerte
    pvy += 0.4; pvx = 0;
    py += pvy;
    pDeadTimer++;
    if(pDeadTimer>90){ resetPlayer(); }
    return;
  }

  // Gravedad
  pvy += GRAVITY;
  px  += pvx;
  py  += pvy;

  // Animación frame
  pFrameTimer++;
  if(pFrameTimer>6){ pFrame++; pFrameTimer=0; }

  // Colisión con plataformas
  onGround = false;
  const PW=22, PH=42;
  for(const [bx,by,bw,bh] of platforms){
    if(collideRect(px,py,PW,PH, bx,by,bw,bh)){
      // desde arriba
      if(pvy>=0 && py+PH-pvy<=by+2){
        py=by-PH; pvy=0; onGround=true;
      }
      // desde abajo
      else if(pvy<0 && py-pvy>=by+bh-2){
        py=by+bh; pvy=0;
      }
      // laterales
      else if(pvx>0){ px=bx-PW; pvx=0; }
      else if(pvx<0){ px=bx+bw; pvx=0; }
    }
  }

  // Límites
  if(px<0) px=0;
  if(py>H+100){ pDead=true; pDeadTimer=0; Audio8bit.death(); }

  // Cámara
  const TARGET = W/3;
  if(px - camX > TARGET) camX = px - TARGET;
  if(camX < 0) camX = 0;
  if(camX > LEVEL_W-W) camX = LEVEL_W-W;

  // Monedas
  for(const c of coinsArr){
    if(!c[2] && collideRect(px,py,PW,PH, c[0]-5,c[1]-5,30,30)){
      c[2]=true; coins++;
      Audio8bit.coin();
      document.getElementById('coinCount').textContent=coins;
    }
  }

  // Estrellas → frases
  for(const s of stars){
    if(!s[2] && collideRect(px,py,PW,PH, s[0]-5,s[1]-5,34,34)){
      s[2]=true;
      Audio8bit.star();
      showFloat(CONFIG.pistas[s[3]]);
      // Fuegos artificiales en la posición de pantalla de la estrella
      const fwScreenX = s[0] - camX;
      const fwScreenY = s[1];
      Fireworks.launch(fwScreenX, fwScreenY, 4);
      // Segunda ráfaga con pequeño delay
      setTimeout(()=> Fireworks.launch(fwScreenX + 30, fwScreenY - 20, 3), 350);
      setTimeout(()=> Fireworks.launch(fwScreenX - 20, fwScreenY - 10, 3), 650);
    }
  }

  // Enemigos
  for(const e of enemies){
    if(!e.alive) continue;
    e.x += e.vx;
    // rebote en suelo
    let onFloor=false;
    for(const [bx,by,bw,bh] of platforms){
      if(e.x+e.w>bx && e.x<bx+bw && Math.abs((e.y+e.h)-by)<4){ onFloor=true; }
      if(e.x<=bx && e.vx<0){ e.vx*=-1; }
      if(e.x+e.w>=bx+bw && e.vx>0){ e.vx*=-1; }
    }

    if(collideRect(px,py,PW,PH, e.x,e.y,e.w,e.h)){
      // jugador cae encima → mata al enemigo
      if(pvy>0 && py+PH < e.y+e.h-4){
        e.alive=false; pvy=-7; Audio8bit.stomp();
      } else {
        // jugador muere
        pDead=true; pDeadTimer=0; pvy=-9; Audio8bit.death();
      }
    }
  }

  // Llegar al castillo
  if(collideRect(px,py,PW,PH, castle.x,castle.y,castle.w,castle.h)){
    triggerProposal();
  }
}

// ══════════════════════════════════════════════
//  🌤️  SISTEMA DE ILUMINACIÓN POR HORA DEL DÍA
// ══════════════════════════════════════════════
function getTimeOfDay(){
  const h = new Date().getHours() + new Date().getMinutes()/60;
  // Devuelve un objeto con paleta y alpha de overlay
  if(h >= 6 && h < 10){
    // Amanecer 6:00–10:00
    const t = (h-6)/4; // 0→1
    return {
      name:'dawn',
      sky:   [lerpC('#1A0A2A','#FF6030',t*0.5), lerpC('#3A1050','#FF9050',t*0.6), lerpC('#FF7020','#FFB060',t*0.7), lerpC('#FFB040','#FFE090',t*0.8)],
      mtn:   lerpC('#301828','#7A4828',t),
      hill:  lerpC('#1A300A','#3A6018',t),
      hillB: lerpC('#204010','#4A7820',t),
      overlay: null,
      stars: t < 0.4,
      sun:   {x:0.15+t*0.2, y:0.55-t*0.35, r:22, c:'#FFB020', glow:'rgba(255,160,0,0.25)', glowEdge:'rgba(255,140,0,0.6)'},
      ambientTint: null,
    };
  } else if(h >= 10 && h < 17){
    // Día 10:00–17:00
    return {
      name:'day',
      sky:   ['#1060C8','#2878D8','#50A0E8','#88C8F8'],
      mtn:   '#3A5080',
      hill:  '#1E6818',
      hillB: '#2A8022',
      overlay: null,
      stars: false,
      sun:   {x:0.75, y:0.08, r:28, c:'#FFE040', glow:'rgba(255,230,80,0.20)', glowEdge:'rgba(255,200,0,0.7)'},
      ambientTint: null,
    };
  } else if(h >= 17 && h < 20){
    // Tarde/Atardecer 17:00–20:00
    const t = (h-17)/3; // 0→1
    return {
      name:'dusk',
      sky:   [lerpC('#1060C8','#1A0828',t*0.9), lerpC('#2878D8','#6A1840',t*0.8), lerpC('#FF8C30','#C03050',t*0.7), lerpC('#FFD060','#FF6030',t*0.6)],
      mtn:   lerpC('#3A5080','#201030',t),
      hill:  lerpC('#1E6818','#1A2408',t),
      hillB: lerpC('#2A8022','#283010',t),
      overlay: `rgba(180,60,0,${0.08+t*0.10})`,
      stars: t > 0.6,
      sun:   {x:0.85+t*0.1, y:0.55+t*0.3, r:26, c:lerpC('#FFE040','#FF4010',t), glow:`rgba(255,100,0,${(0.3+t*0.2).toFixed(2)})`, glowEdge:`rgba(200,60,0,${(0.6+t*0.2).toFixed(2)})`},
      ambientTint: `rgba(255,120,20,${0.06+t*0.08})`,
    };
  } else {
    // Noche 20:00–6:00
    const isDeepNight = h >= 22 || h < 4;
    return {
      name:'night',
      sky:   ['#02020F','#060818','#0A0E22','#0E1428'],
      mtn:   '#10141E',
      hill:  '#080E04',
      hillB: '#0A1206',
      overlay: 'rgba(0,5,30,0.35)',
      stars: true,
      moon:  {x:0.82, y:0.12, r:20},
      ambientTint: `rgba(10,20,80,${isDeepNight?0.18:0.12})`,
    };
  }
}

// Interpola dos colores hex — versión segura sin operaciones de bits
function lerpC(a, b, t){
  const ah=parseInt(a.slice(1),16), bh=parseInt(b.slice(1),16);
  const ar=(ah>>16)&255, ag=(ah>>8)&255, ab=ah&255;
  const br=(bh>>16)&255, bg=(bh>>8)&255, bb=bh&255;
  const rr=Math.min(255,Math.max(0,Math.round(ar+(br-ar)*t)));
  const rg=Math.min(255,Math.max(0,Math.round(ag+(bg-ag)*t)));
  const rb=Math.min(255,Math.max(0,Math.round(ab+(bb-ab)*t)));
  return '#'+rr.toString(16).padStart(2,'0')+rg.toString(16).padStart(2,'0')+rb.toString(16).padStart(2,'0');
}

// Dibuja estrellas nocturnas (precalculadas)
const NIGHT_STARS = Array.from({length:120},()=>({
  x: Math.random()*800, y: Math.random()*220,
  r: Math.random()*1.2+0.3, phase: Math.random()*Math.PI*2
}));

function drawNightStars(alpha){
  NIGHT_STARS.forEach(s=>{
    const twinkle = 0.5+0.5*Math.sin(Date.now()*0.002+s.phase);
    ctx.fillStyle = `rgba(255,255,255,${alpha*(0.4+twinkle*0.6)})`;
    ctx.beginPath();
    ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fill();
    if(s.r>0.9){
      ctx.strokeStyle=`rgba(255,255,255,${alpha*twinkle*0.3})`;
      ctx.lineWidth=0.7;
      ctx.beginPath();
      ctx.moveTo(s.x-s.r*3,s.y); ctx.lineTo(s.x+s.r*3,s.y);
      ctx.moveTo(s.x,s.y-s.r*3); ctx.lineTo(s.x,s.y+s.r*3);
      ctx.stroke();
    }
  });
}

function drawMoon(x,y,r){
  // Luna con cratera
  const grd = ctx.createRadialGradient(x-r*0.2,y-r*0.2,r*0.1,x,y,r);
  grd.addColorStop(0,'#FFFDE0');
  grd.addColorStop(0.7,'#E8E0A0');
  grd.addColorStop(1,'#C8B870');
  ctx.fillStyle=grd;
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  // sombra lunar (fase)
  ctx.fillStyle='rgba(5,8,20,0.55)';
  ctx.beginPath(); ctx.arc(x+r*0.3,y,r*0.95,0,Math.PI*2); ctx.fill();
  // crateras
  [[x-6,y+4,3],[x+5,y-5,2],[x-2,y-8,2]].forEach(([cx,cy,cr])=>{
    ctx.fillStyle='rgba(0,0,0,0.18)';
    ctx.beginPath(); ctx.arc(cx,cy,cr,0,Math.PI*2); ctx.fill();
  });
  // halo
  const halo = ctx.createRadialGradient(x,y,r,x,y,r*2.2);
  halo.addColorStop(0,'rgba(255,250,200,0.10)');
  halo.addColorStop(1,'rgba(255,250,200,0)');
  ctx.fillStyle=halo;
  ctx.beginPath(); ctx.arc(x,y,r*2.2,0,Math.PI*2); ctx.fill();
}

function drawSun(tod){
  const {sun} = tod;
  if(!sun) return;
  const sx = sun.x*W, sy = sun.y*H;
  // halo externo
  const halo = ctx.createRadialGradient(sx,sy,sun.r,sx,sy,sun.r*4);
  halo.addColorStop(0,sun.glow);
  halo.addColorStop(1,'rgba(255,200,0,0)');
  ctx.fillStyle=halo;
  ctx.beginPath(); ctx.arc(sx,sy,sun.r*4,0,Math.PI*2); ctx.fill();
  // disco solar — usar glowEdge predefinido, nunca manipular strings
  const disc = ctx.createRadialGradient(sx-sun.r*0.2,sy-sun.r*0.2,2,sx,sy,sun.r);
  disc.addColorStop(0,'#FFFFFF');
  disc.addColorStop(0.3,sun.c);
  disc.addColorStop(1,sun.glowEdge);
  ctx.fillStyle=disc;
  ctx.beginPath(); ctx.arc(sx,sy,sun.r,0,Math.PI*2); ctx.fill();
}

// Indicador de hora en HUD
function updateTimeIndicator(){
  const tod = getTimeOfDay();
  const icons = {dawn:'🌅',day:'☀️',dusk:'🌆',night:'🌙'};
  const el = document.getElementById('timeOfDayIcon');
  if(el) el.textContent = icons[tod.name]||'☀️';
}
setInterval(updateTimeIndicator, 60000);

// ══════════════════════════════════════════════
//  🎆  SISTEMA DE FUEGOS ARTIFICIALES
// ══════════════════════════════════════════════
const Fireworks = (() => {
  // Cada partícula de explosión
  // { x, y, vx, vy, r, life, maxLife, color, trail:[] }
  const particles = [];
  // Cada cohete ascendente
  // { x, y, vy, targetY, color, trail:[] }
  const rockets   = [];

  // Paleta vibrante de colores
  const COLORS = [
    '#FF4466','#FF8800','#FFEE00','#44FF88',
    '#44CCFF','#CC44FF','#FF44CC','#FFFFFF',
    '#FFB020','#80FF40','#FF6060','#40DDFF',
  ];

  function rnd(a,b){ return a + Math.random()*(b-a); }
  function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

  // Lanza una explosión en (ex, ey) en coordenadas de PANTALLA
  function explode(ex, ey, col){
    const count = Math.floor(rnd(28,42));
    const baseCol = col || pick(COLORS);
    for(let i=0;i<count;i++){
      const angle  = (i/count)*Math.PI*2 + rnd(-0.15,0.15);
      const speed  = rnd(1.5,4.5);
      const life   = Math.floor(rnd(30,55));
      // colores: algunas del color base, algunas blancas (destello)
      const pCol   = Math.random()<0.25 ? '#FFFFFF' : baseCol;
      particles.push({
        x:ex, y:ey,
        vx: Math.cos(angle)*speed,
        vy: Math.sin(angle)*speed,
        r: rnd(2.5,4),
        life, maxLife:life,
        color: pCol,
        trail: [],
        twinkle: Math.random()<0.4,
      });
    }
    // chispas secundarias más pequeñas
    for(let i=0;i<18;i++){
      const angle = rnd(0,Math.PI*2);
      const speed = rnd(0.5,2);
      particles.push({
        x:ex, y:ey,
        vx: Math.cos(angle)*speed,
        vy: Math.sin(angle)*speed - rnd(0,1),
        r: rnd(1,2),
        life:Math.floor(rnd(15,30)), maxLife:30,
        color:'#FFD700',
        trail:[],
        twinkle:false,
      });
    }
  }

  // Lanza cohetes desde la posición del jugador en pantalla
  function launch(screenX, screenY, count){
    const cols = [pick(COLORS), pick(COLORS), pick(COLORS)];
    for(let i=0;i<(count||3);i++){
      const targetY = rnd(30, 180);
      rockets.push({
        x: screenX + rnd(-40,40),
        y: screenY,
        vy: rnd(-9,-13),
        targetY,
        color: cols[i % cols.length],
        trail: [],
        exploded: false,
      });
    }
  }

  function update(){
    // Cohetes
    for(let i=rockets.length-1;i>=0;i--){
      const rk = rockets[i];
      rk.trail.push({x:rk.x, y:rk.y});
      if(rk.trail.length>10) rk.trail.shift();
      rk.vy += 0.18; // gravedad suave
      rk.y  += rk.vy;
      if(rk.y <= rk.targetY || rk.vy >= 0){
        explode(rk.x, rk.y, rk.color);
        rockets.splice(i,1);
      }
    }
    // Partículas
    for(let i=particles.length-1;i>=0;i--){
      const p = particles[i];
      p.trail.push({x:p.x, y:p.y});
      if(p.trail.length>6) p.trail.shift();
      p.vx *= 0.96;
      p.vy *= 0.96;
      p.vy += 0.09; // gravedad
      p.x  += p.vx;
      p.y  += p.vy;
      p.life--;
      if(p.life<=0) particles.splice(i,1);
    }
  }

  function draw(){
    // Cohetes (línea brillante hacia arriba)
    rockets.forEach(rk=>{
      // estela
      for(let i=0;i<rk.trail.length;i++){
        const a = (i/rk.trail.length)*0.6;
        ctx.fillStyle = `rgba(255,220,100,${a})`;
        ctx.beginPath();
        ctx.arc(rk.trail[i].x, rk.trail[i].y, 2*(i/rk.trail.length)+0.5, 0, Math.PI*2);
        ctx.fill();
      }
      // cabeza del cohete
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.arc(rk.x, rk.y, 3, 0, Math.PI*2);
      ctx.fill();
    });

    // Partículas
    particles.forEach(p=>{
      const alpha = p.life / p.maxLife;
      const radius = p.r * (0.4 + 0.6 * alpha);

      // estela de la partícula
      for(let i=0;i<p.trail.length;i++){
        const ta = (i/p.trail.length) * alpha * 0.5;
        ctx.fillStyle = p.color.replace(')',`,${ta})`).replace('rgb(','rgba(').replace('#', 'rgba(').replace(/^rgba\(([0-9a-fA-F]{2})([0-9a-fA-F]{2})([0-9a-fA-F]{2})/, (_,r2,g2,b2)=>`rgba(${parseInt(r2,16)},${parseInt(g2,16)},${parseInt(b2,16)}`);
        // Simplificamos: usar globalAlpha
        ctx.globalAlpha = ta;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.trail[i].x, p.trail[i].y, radius*0.5, 0, Math.PI*2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      // brillo exterior (glow)
      if(radius > 2){
        const grd = ctx.createRadialGradient(p.x,p.y,0, p.x,p.y,radius*2.5);
        grd.addColorStop(0, p.color);
        grd.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.globalAlpha = alpha * 0.35;
        ctx.fillStyle = grd;
        ctx.beginPath();
        ctx.arc(p.x, p.y, radius*2.5, 0, Math.PI*2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }

      // partícula principal
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, radius, 0, Math.PI*2);
      ctx.fill();

      // twinkle (destello en cruz)
      if(p.twinkle && alpha > 0.4){
        ctx.globalAlpha = alpha * 0.7;
        ctx.strokeStyle = '#FFFFFF';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(p.x - radius*3, p.y);
        ctx.lineTo(p.x + radius*3, p.y);
        ctx.moveTo(p.x, p.y - radius*3);
        ctx.lineTo(p.x, p.y + radius*3);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    });
  }

  return { launch, update, draw,
    get active(){ return particles.length>0 || rockets.length>0; }
  };
})();

function render(){
  ctx.clearRect(0,0,W,H);

  const tod = getTimeOfDay();

  // ── CIELO ──
  const sky = ctx.createLinearGradient(0,0,0,H);
  tod.sky.forEach((c,i)=> sky.addColorStop(i/3, c));
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);

  // Estrellas (noche / amanecer temprano / atardecer tardío)
  if(tod.stars) drawNightStars(tod.name==='night'?1:0.5);

  // Sol o Luna
  if(tod.moon) drawMoon(tod.moon.x*W, tod.moon.y*H, tod.moon.r);
  if(tod.sun)  drawSun(tod);

  // ── MONTAÑAS ──
  const mOff = (camX*0.15)%W;
  ctx.fillStyle=tod.mtn;
  for(let m=-1;m<3;m++){
    const mx = m*280 - mOff%280;
    ctx.beginPath();
    ctx.moveTo(mx,H*0.72);
    ctx.lineTo(mx+40,H*0.48); ctx.lineTo(mx+80,H*0.58);
    ctx.lineTo(mx+120,H*0.40); ctx.lineTo(mx+170,H*0.55);
    ctx.lineTo(mx+210,H*0.44); ctx.lineTo(mx+260,H*0.62);
    ctx.lineTo(mx+280,H*0.72);
    ctx.closePath(); ctx.fill();
    // nieve en picos (solo de día / amanecer)
    if(tod.name==='day'||tod.name==='dawn'){
      ctx.fillStyle='rgba(230,240,255,0.7)';
      ctx.beginPath();
      ctx.moveTo(mx+115,H*0.40); ctx.lineTo(mx+120,H*0.40);
      ctx.lineTo(mx+130,H*0.48); ctx.lineTo(mx+110,H*0.48);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle=tod.mtn;
    }
  }

  // ── COLINAS ──
  const hOff = (camX*0.35)%W;
  ctx.fillStyle=tod.hill;
  for(let m=-1;m<4;m++){
    const mx = m*200 - hOff%200;
    ctx.beginPath();
    ctx.moveTo(mx,H);
    ctx.quadraticCurveTo(mx+50,H*0.62,mx+100,H*0.68);
    ctx.quadraticCurveTo(mx+150,H*0.58,mx+200,H);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle=tod.hillB; ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(mx,H);
    ctx.quadraticCurveTo(mx+50,H*0.62,mx+100,H*0.68);
    ctx.quadraticCurveTo(mx+150,H*0.58,mx+200,H);
    ctx.stroke();
  }

  ctx.save();
  ctx.translate(-camX,0);

  // Nubes (ocultas de noche)
  if(tod.name!=='night'){
    ctx.globalAlpha = tod.name==='dusk' ? 0.7 : 1;
    for(const [cx,cy] of clouds) drawCloud(cx,cy);
    ctx.globalAlpha=1;
  }

  // Suelo y plataformas
  for(const [bx,by,bw,bh] of platforms){
    if(bh>30) drawBlock(bx,by,bw,bh,tod);
    else       drawElevatedPlat(bx,by,bw,tod);
  }

  // Arbustos
  for(const [bx,by] of bushes) drawBush(bx,by,tod);

  // Monedas
  for(const c of coinsArr) if(!c[2]) drawCoin(c[0],c[1]);

  // Estrellas coleccionables
  for(const s of stars) if(!s[2]) drawStar(s[0],s[1]);

  // Castillo
  drawCastle(castle.x,castle.y);

  // Enemigos
  for(const e of enemies) drawGoomba(e.x, e.y, e.alive);

  // Jugador
  drawPlayer(px,py);

  ctx.restore();

  // ── OVERLAY DE AMBIENTE (tinte de color sobre todo) ──
  if(tod.ambientTint){
    ctx.fillStyle=tod.ambientTint;
    ctx.fillRect(0,0,W,H);
  }
  if(tod.overlay){
    ctx.fillStyle=tod.overlay;
    ctx.fillRect(0,0,W,H);
  }

  // ── FUEGOS ARTIFICIALES (encima de todo) ──
  Fireworks.update();
  Fireworks.draw();
}

}

  keys[e.key]=true;
  if((e.key==='Enter'||e.key===' ') && gameState==='start'){

      startGame();

});

document.getElementById('startScreen').addEventListener('click', ()=>{
  if(gameState==='start'){
    Audio8bit.init(); // unlock AudioContext en el evento de usuario
    if(!_introStarted){
      IntroMusic.play(Audio8bit._getCtx(), Audio8bit._getMaster());
      _introStarted = true;
    } else {
      startGame();
    }
  }
});

// ── Mute ──
let muted = false;
function toggleMute(){
  muted = !muted;
  const btn = document.getElementById('muteBtn');
  // Web Audio API: suspend/resume el contexto
  try {
    const ac = Audio8bit._ctx && Audio8bit._ctx();
  } catch(e){}
  // Usamos el masterGain expuesto vía hack
  Audio8bit._setMute(muted);
  btn.textContent = muted ? '🔇' : '🔊';
}

// ── CONTROLES TÁCTILES ──
const touchBtns = {};
function addTouch(id,key){
  const el=document.getElementById(id);
  if(!el) return;
  el.addEventListener('touchstart',e=>{ e.preventDefault(); keys[key]=true; },{passive:false});
  el.addEventListener('touchend',  e=>{ e.preventDefault(); keys[key]=false;},{passive:false});
}

// Crear overlay de botones táctiles
const touchDiv = document.createElement('div');
touchDiv.style.cssText=`position:absolute;bottom:8px;left:0;width:100%;display:flex;justify-content:space-between;padding:0 12px;pointer-events:none;z-index:15;`;
touchDiv.innerHTML=`
  <div style="display:flex;gap:8px;pointer-events:all;">
    <button id="btnL" style="font-size:22px;padding:10px 16px;background:rgba(0,0,0,0.5);color:#fff;border:2px solid #fff;border-radius:8px;font-family:monospace;">◀</button>
    <button id="btnR" style="font-size:22px;padding:10px 16px;background:rgba(0,0,0,0.5);color:#fff;border:2px solid #fff;border-radius:8px;font-family:monospace;">▶</button>
  </div>
  <div style="pointer-events:all;">
    <button id="btnJ" style="font-size:22px;padding:10px 20px;background:rgba(220,50,50,0.7);color:#fff;border:2px solid #fff;border-radius:8px;font-family:monospace;">▲</button>
  </div>`;
document.getElementById('wrapper').appendChild(touchDiv);
addTouch('btnL','ArrowLeft');
addTouch('btnR','ArrowRight');
addTouch('btnJ','ArrowUp');

// Render inicial (pantalla de inicio)
render();

StartScreen.init();

</script>
